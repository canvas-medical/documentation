<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="pdb-title pdb-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <title id="pdb-title">Portal Docked Application bands on the patient portal</title>
  <desc id="pdb-desc">Two phone screens showing the patient portal. In the first, a single band docked to the bottom edge spans the full width and can be up to 25% of the screen height. In the second, one band is docked to the top edge and one to the bottom edge, and each is capped at 12.5% of the screen height. Each edge shows at most one band, chosen by the lowest PRIORITY value, and DOCK_SIZE sets a fixed height.</desc>

  <defs>
    <marker id="pdb-arrow" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto-start-reverse">
      <path d="M0,1 L6,4 L0,7 z" fill="#082b48"/>
    </marker>
  </defs>

  <!-- one band: bottom edge, up to 25% -->
  <rect x="60" y="30" width="170" height="340" rx="18" fill="#ffffff" stroke="#082b48" stroke-width="1.5"/>
  <rect x="68" y="50" width="154" height="300" fill="#f5f5f5"/>
  <rect x="68" y="275" width="154" height="75" fill="#98d2dc"/>
  <line x1="68" y1="275" x2="222" y2="275" stroke="#22698c" stroke-width="3"/>
  <text x="145" y="166" fill="#5b6672" font-size="13" text-anchor="middle">Patient portal</text>
  <text x="145" y="317" fill="#082b48" font-size="13" text-anchor="middle">Bottom band</text>

  <line x1="46" y1="275" x2="46" y2="350" stroke="#082b48" stroke-width="1" marker-start="url(#pdb-arrow)" marker-end="url(#pdb-arrow)"/>
  <line x1="40" y1="275" x2="52" y2="275" stroke="#082b48" stroke-width="1"/>
  <line x1="40" y1="350" x2="52" y2="350" stroke="#082b48" stroke-width="1"/>
  <text x="36" y="316" fill="#082b48" font-size="11" text-anchor="end">25%</text>

  <text x="145" y="396" fill="#082b48" font-size="12" font-weight="600" text-anchor="middle">One band: up to 25%</text>
  <text x="145" y="413" fill="#5b6672" font-size="11" text-anchor="middle">of the screen height.</text>

  <!-- two bands: top and bottom, 12.5% each -->
  <rect x="290" y="30" width="170" height="340" rx="18" fill="#ffffff" stroke="#082b48" stroke-width="1.5"/>
  <rect x="298" y="50" width="154" height="300" fill="#f5f5f5"/>
  <rect x="298" y="50" width="154" height="37.5" fill="#cfe9ee"/>
  <rect x="298" y="312.5" width="154" height="37.5" fill="#98d2dc"/>
  <line x1="298" y1="87.5" x2="452" y2="87.5" stroke="#22698c" stroke-width="3"/>
  <line x1="298" y1="312.5" x2="452" y2="312.5" stroke="#22698c" stroke-width="3"/>
  <text x="375" y="73" fill="#082b48" font-size="13" text-anchor="middle">Top band</text>
  <text x="375" y="204" fill="#5b6672" font-size="13" text-anchor="middle">Patient portal</text>
  <text x="375" y="336" fill="#082b48" font-size="13" text-anchor="middle">Bottom band</text>

  <line x1="474" y1="50" x2="474" y2="87.5" stroke="#082b48" stroke-width="1" marker-start="url(#pdb-arrow)" marker-end="url(#pdb-arrow)"/>
  <line x1="468" y1="50" x2="480" y2="50" stroke="#082b48" stroke-width="1"/>
  <line x1="468" y1="87.5" x2="480" y2="87.5" stroke="#082b48" stroke-width="1"/>
  <text x="484" y="73" fill="#082b48" font-size="11">12.5%</text>
  <line x1="474" y1="312.5" x2="474" y2="350" stroke="#082b48" stroke-width="1" marker-start="url(#pdb-arrow)" marker-end="url(#pdb-arrow)"/>
  <line x1="468" y1="312.5" x2="480" y2="312.5" stroke="#082b48" stroke-width="1"/>
  <line x1="468" y1="350" x2="480" y2="350" stroke="#082b48" stroke-width="1"/>
  <text x="484" y="335" fill="#082b48" font-size="11">12.5%</text>

  <text x="375" y="396" fill="#082b48" font-size="12" font-weight="600" text-anchor="middle">Two bands: up to 12.5% each</text>
  <text x="375" y="413" fill="#5b6672" font-size="11" text-anchor="middle">of the screen height.</text>

  <g font-size="11" fill="#5b6672">
    <text x="540" y="60" fill="#082b48" font-size="12" font-weight="600">Full width, on every page</text>
    <text x="540" y="78">Each band spans the window and</text>
    <text x="540" y="93">stays in place as the patient</text>
    <text x="540" y="108">moves between portal pages.</text>
    <text x="540" y="146" fill="#082b48" font-size="12" font-weight="600">One band per edge</text>
    <text x="540" y="164">When two bands share an edge,</text>
    <text x="540" y="179">the lower PRIORITY value is</text>
    <text x="540" y="194">shown and the other is not.</text>
    <text x="540" y="232" fill="#082b48" font-size="12" font-weight="600">Fixed height</text>
    <text x="540" y="250">DOCK_SIZE sets the height. A</text>
    <text x="540" y="265">taller value is cut to the cap,</text>
    <text x="540" y="280">and bands can't be resized.</text>
  </g>
</svg>

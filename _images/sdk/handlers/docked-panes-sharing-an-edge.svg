<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-labelledby="dpe-title dpe-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <title id="dpe-title">Two docked panes sharing the right edge</title>
  <desc id="dpe-desc">A Canvas window whose right edge holds two panes. The edge is a single track, as wide as the larger of the two DOCK_SIZE values rather than as wide as both added together. The two panes stack top to bottom inside it and split its height evenly, with the lower PRIORITY value first in the stack.</desc>

  <defs>
    <marker id="dpe-arrow" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto-start-reverse">
      <path d="M0,1 L6,4 L0,7 z" fill="#082b48"/>
    </marker>
  </defs>

  <!-- one track, sized by the larger pane -->
  <line x1="390" y1="42" x2="519" y2="42" stroke="#082b48" stroke-width="1" marker-start="url(#dpe-arrow)" marker-end="url(#dpe-arrow)"/>
  <line x1="390" y1="36" x2="390" y2="48" stroke="#082b48" stroke-width="1"/>
  <line x1="519" y1="36" x2="519" y2="48" stroke="#082b48" stroke-width="1"/>

  <rect x="40" y="52" width="480" height="160" rx="6" fill="#ffffff" stroke="#082b48" stroke-width="1.5"/>
  <rect x="41" y="53" width="349" height="158" fill="#f5f5f5"/>
  <text x="215" y="136" fill="#5b6672" font-size="13" text-anchor="middle">Canvas EHR</text>

  <rect x="390" y="53" width="129" height="79" fill="#98d2dc"/>
  <rect x="390" y="132" width="129" height="79" fill="#cfe9ee"/>
  <line x1="390" y1="132" x2="519" y2="132" stroke="#22698c" stroke-width="1.5"/>
  <line x1="390" y1="52" x2="390" y2="212" stroke="#22698c" stroke-width="3"/>
  <text x="455" y="97" fill="#082b48" font-size="13" text-anchor="middle">Pane A</text>
  <text x="455" y="176" fill="#082b48" font-size="13" text-anchor="middle">Pane B</text>

  <g font-size="11">
    <text x="536" y="40" fill="#082b48" font-size="12" font-weight="600">One track</text>
    <text x="536" y="58" fill="#5b6672">As wide as the larger of the two</text>
    <text x="536" y="73" fill="#5b6672">DOCK_SIZE values, not as wide as</text>
    <text x="536" y="88" fill="#5b6672">both added together.</text>

    <text x="536" y="118" fill="#082b48" font-size="12" font-weight="600">Pane A: PRIORITY 0</text>
    <text x="536" y="136" fill="#5b6672">The lower value goes first.</text>

    <text x="536" y="166" fill="#082b48" font-size="12" font-weight="600">Pane B: PRIORITY 10</text>
    <text x="536" y="184" fill="#5b6672">Each pane gets half the edge.</text>
  </g>

  <text x="40" y="242" fill="#5b6672" font-size="11">On a left or right edge the panes stack top to bottom, as above. On a top or bottom edge they sit side by side,</text>
  <text x="40" y="258" fill="#5b6672" font-size="11">and "first" means the left-hand one.</text>
</svg>

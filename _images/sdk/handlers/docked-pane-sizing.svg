<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="dps-title dps-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <title id="dps-title">How a docked pane is sized</title>
  <desc id="dps-desc">Two views of a Canvas window with a pane docked to the right edge. In the first, the pane is at DOCK_SIZE, which is its initial size and its ceiling; a user can drag the divider to any width from 48 pixels up to half the viewport on that axis. In the second, the plugin has collapsed its own pane to a thin rail, which it may do below the 48 pixel floor, though it cannot resize past the ceiling.</desc>

  <defs>
    <marker id="dps-arrow" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto-start-reverse">
      <path d="M0,1 L6,4 L0,7 z" fill="#082b48"/>
    </marker>
  </defs>

  <!-- pane at DOCK_SIZE -->
  <line x1="390" y1="42" x2="519" y2="42" stroke="#082b48" stroke-width="1" marker-start="url(#dps-arrow)" marker-end="url(#dps-arrow)"/>
  <line x1="390" y1="36" x2="390" y2="48" stroke="#082b48" stroke-width="1"/>
  <line x1="519" y1="36" x2="519" y2="48" stroke="#082b48" stroke-width="1"/>

  <rect x="40" y="52" width="480" height="124" rx="6" fill="#ffffff" stroke="#082b48" stroke-width="1.5"/>
  <rect x="41" y="53" width="349" height="122" fill="#f5f5f5"/>
  <rect x="390" y="53" width="129" height="122" fill="#98d2dc"/>
  <line x1="390" y1="52" x2="390" y2="176" stroke="#22698c" stroke-width="3"/>
  <text x="215" y="118" fill="#5b6672" font-size="13" text-anchor="middle">Canvas EHR</text>
  <text x="455" y="118" fill="#082b48" font-size="13" text-anchor="middle">pane</text>

  <g font-size="12">
    <text x="536" y="40" fill="#082b48" font-weight="600">DOCK_SIZE</text>
    <text x="536" y="58" fill="#5b6672" font-size="11">The pane's initial size,</text>
    <text x="536" y="73" fill="#5b6672" font-size="11">and its ceiling.</text>
  </g>

  <!-- the user drags the divider -->
  <line x1="326" y1="200" x2="454" y2="200" stroke="#082b48" stroke-width="1.5" marker-start="url(#dps-arrow)" marker-end="url(#dps-arrow)"/>
  <text x="390" y="222" fill="#082b48" font-size="12" text-anchor="middle">A user drags the divider: no smaller than 48px,</text>
  <text x="390" y="238" fill="#082b48" font-size="12" text-anchor="middle">no larger than half the viewport on this axis.</text>

  <!-- collapsed to a rail -->
  <rect x="40" y="262" width="480" height="96" rx="6" fill="#ffffff" stroke="#082b48" stroke-width="1.5"/>
  <rect x="41" y="263" width="458" height="94" fill="#f5f5f5"/>
  <rect x="499" y="263" width="20" height="94" fill="#f4a155"/>
  <line x1="499" y1="262" x2="499" y2="358" stroke="#c07536" stroke-width="2"/>
  <text x="270" y="315" fill="#5b6672" font-size="13" text-anchor="middle">Canvas EHR</text>

  <g font-size="11" fill="#5b6672">
    <text x="536" y="286" fill="#082b48" font-size="12" font-weight="600">Collapsed to a rail</text>
    <text x="536" y="305">The plugin resizing its own</text>
    <text x="536" y="320">pane may go below the 48px</text>
    <text x="536" y="335">floor, but never past the</text>
    <text x="536" y="350">ceiling above.</text>
  </g>
</svg>

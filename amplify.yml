version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Ruby, Node, and uv come from the build image (build-image/Dockerfile)
        - 'test "$(ruby -e "print RUBY_VERSION")" = "$(cat .ruby-version)" || { echo "Build image has Ruby $(ruby -e "print RUBY_VERSION"), .ruby-version wants $(cat .ruby-version): rerun once the Build image workflow has pushed"; exit 1; }'
        - gem install bundler -v $(tail -1 Gemfile.lock | tr -d ' ')
    build:
      commands:
        - bundle install
        - yarn install
        - yarn build
  artifacts:
    baseDirectory: _site/
    files:
      - '**/*'
  cache:
    paths: []

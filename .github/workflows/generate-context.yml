name: Generate Coding Agent Context
on:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:00 UTC). The Help Center is external to this repo, so its
    # platform context is refreshed on a timer rather than by a path-based push.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "collections/_api/**"
      - "collections/_guides/**"
      - "collections/_sdk/**"
      - "_layouts/**"
      - "_includes/**"
      - "_data/**"
jobs:
  generate-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Generate context file
        run: uv run ./generate-context.py
      - name: Generate platform context files
        run: uv run ./generate-platform-context.py
      - name: Commit updated context files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate context files"
          file_pattern: "sdk-context.txt fhir-context.txt platform-context.txt platform-index.txt"

name: Generate Docs for Example Plugins

on:
  workflow_dispatch:
    inputs:
      plugins_changed:
        required: true
        type: string

jobs:
  generate-example-plugin-docs:
    runs-on: ubuntu-latest
    steps:
      # Webhook sender should only send if the branch merged into was main
      # Webhook sender should specify:
      # - plugins_changed
      - name: Log plugins changed
        run: |
          echo "plugins changed: ${{ inputs.plugins_changed }}"
      - name: Checkout the docs repo
        uses: actions/checkout@v4  
      - name: Checkout the canvas-plugins repo
        run: |
          git clone https://github.com/canvas-medical/canvas-plugins.git
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Execute content generation script for each plugin with changes
        run: |
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} ruby scripts/sdk/generate_example_plugins_docs.rb ${{ inputs.plugins_changed }}
      - name: Remove the canvas-plugins repo so we don't check it in
        run: |
          rm -rf canvas-plugins/
      - name: Open pull request with files generated by script
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PROJECT_AND_REPO_PAT }}
          branch: generate-docs-${{ github.run_id }}-${{ github.run_attempt }}
          title: Generate Example Plugin Docs ${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: "Generate docs for recently changed example plugins"
          body: |
            ## TODO
            - [ ] Remove redundant header if the plugin's readme also specifies a header
            - [ ] Review content for accuracy and edit to seem a little less generated. Make sure the content is actually useful and relevant. Remember, this is just a starting point.
            - [ ] Add an entry to `_data/menus.yml` (This could be automated, but it would resort every list in that file, which is not desireable.)

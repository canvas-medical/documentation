name: Release - API Merge Release Branch
on:
  repository_dispatch:
    types: [merge-release-branch]

jobs:
  merge-release-branch-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        id: checkout-repo
        uses: actions/checkout@v4
      - name: Merge Release Branch
        id: merge-release-branch
        uses: ./.github/actions/merge-release-branch
        with:
          release_name: ${{ github.event.client_payload.release_name }}
          dry_run: ${{ github.event.client_payload.dry_run }}

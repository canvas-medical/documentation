name: Test code blocks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

# Pull requests run code their markdown imports, so the job gets a read-only
# token and the checkout keeps no credentials.
permissions:
  contents: read

jobs:
  test-code:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test code blocks
        env:
          GITHUB_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          # always install the most recent released version of canvas
          uv lock --upgrade-package canvas
          uv sync
          uv run ./test-code-blocks.py
